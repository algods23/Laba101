<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
    <title id="title">Laba101 logo</title>
    <desc id="desc">White Laba101 laundry mark on a dark blue background.</desc>
    <defs>
        <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#061a42"/>
            <stop offset="0.45" stop-color="#08285f"/>
            <stop offset="1" stop-color="#031336"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#010817" flood-opacity="0.45"/>
        </filter>
    </defs>
    <rect width="1600" height="1000" fill="url(#navy)"/>
    <rect x="30" y="30" width="1540" height="940" fill="none" stroke="#fff" stroke-width="24"/>
    <g fill="#fff" filter="url(#softShadow)">
        <text x="800" y="410" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="420" font-weight="900">LABA</text>
        <text x="430" y="850" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="520" font-weight="900">1</text>
        <text x="1190" y="850" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="520" font-weight="900">1</text>
    </g>
    <g transform="translate(810 680)" fill="none" stroke="#fff" stroke-width="26" filter="url(#softShadow)">
        <circle r="205"/>
        <path d="M-160 45 C-120 72 -75 72 -38 48 C-2 74 42 74 82 48 C115 71 155 70 188 44"/>
        <path d="M-170 40 C-155 135 -80 180 0 180 C82 180 160 132 178 40" fill="#fff" stroke="none"/>
        <circle cx="-140" cy="20" r="18" fill="#fff" stroke="none"/>
        <circle cx="-78" cy="18" r="16" fill="#fff" stroke="none"/>
        <circle cx="0" cy="40" r="28" fill="#fff" stroke="none"/>
        <circle cx="55" cy="-2" r="14" fill="#fff" stroke="none"/>
        <circle cx="122" cy="18" r="20" fill="#fff" stroke="none"/>
        <circle cx="-60" cy="125" r="12" fill="#061a42" stroke="none"/>
        <circle cx="-12" cy="118" r="10" fill="#061a42" stroke="none"/>
        <circle cx="55" cy="116" r="15" fill="#061a42" stroke="none"/>
    </g>
</svg>
